name: Update weapon data

on:

  workflow_dispatch:

  schedule:

    - cron: "17 18 * * *"

  push:

    branches:
      - main


permissions:

  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      - name: Install dependencies

        run: |

          pip install requests beautifulsoup4 lxml


      - name: Scrape weapon data

        run: |

          python scraper.py


      - name: Commit data

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/weapons.json

          git diff --cached --quiet || \
            git commit \
            -m "Update weapon data"

          git push
